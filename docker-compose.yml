version: "3.9"

# PulsePin full stack. Two profiles:
#   docker compose up                 -> dev-shaped (Traefik with self-signed
#                                         local TLS, direct port publishing)
#   docker compose --profile prod up  -> adds the ACME/Let's Encrypt resolver
#                                         and drops direct port publishing on
#                                         internal services (network
#                                         segmentation, Security Architecture
#                                         Section 6)
#
# Internal services (db, redis, backend) are attached ONLY to the
# `internal` network, which has no route to the outside world — Traefik is
# the sole ingress point, matching "network segmentation... never directly
# internet-facing" (Security Architecture Section 6).

networks:
  internal:
    internal: true
  edge:

volumes:
  postgres_data:
  redis_data:
  letsencrypt:

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulsepin}
      POSTGRES_USER: ${POSTGRES_USER:-pulsepin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a real password in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulsepin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set a real password in .env}"]
    volumes:
      - redis_data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build: ./backend
    command: ["python", "-m", "alembic", "upgrade", "head"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pulsepin}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pulsepin}
    depends_on:
      db: { condition: service_healthy }
    networks: [internal]

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pulsepin}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pulsepin}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    networks: [internal, edge]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=pulsepin_edge"
      - "traefik.http.routers.backend.rule=Host(`${API_DOMAIN:-api.localhost}`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.backend.middlewares=rate-limit@file,security-headers@file"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
      # Stricter limit specifically on the dispatch-trigger endpoint
      # (Security Architecture 3: "strictest limits on the emergency
      # dispatch trigger endpoint").
      - "traefik.http.routers.backend-dispatch.rule=Host(`${API_DOMAIN:-api.localhost}`) && Path(`/api/v1/dispatch`)"
      - "traefik.http.routers.backend-dispatch.entrypoints=websecure"
      - "traefik.http.routers.backend-dispatch.tls.certresolver=letsencrypt"
      - "traefik.http.routers.backend-dispatch.middlewares=dispatch-trigger-strict-rate-limit@file,security-headers@file"
      - "traefik.http.routers.backend-dispatch.service=backend"

  frontend-patient:
    build: ./frontend-patient
    restart: unless-stopped
    networks: [edge]
    depends_on: [backend]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=pulsepin_edge"
      - "traefik.http.routers.patient.rule=Host(`${PATIENT_DOMAIN:-app.localhost}`)"
      - "traefik.http.routers.patient.entrypoints=websecure"
      - "traefik.http.routers.patient.tls.certresolver=letsencrypt"
      - "traefik.http.routers.patient.middlewares=security-headers@file"

  frontend-dispatcher:
    build: ./frontend-dispatcher
    restart: unless-stopped
    networks: [edge]
    depends_on: [backend]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=pulsepin_edge"
      - "traefik.http.routers.dispatcher.rule=Host(`${DISPATCHER_DOMAIN:-dispatch.localhost}`)"
      - "traefik.http.routers.dispatcher.entrypoints=websecure"
      - "traefik.http.routers.dispatcher.tls.certresolver=letsencrypt"
      # IP allow-listing on the admin/dispatcher interface (Security
      # Architecture 3). Configure infra/traefik/dynamic.yml's
      # admin-ipallowlist sourceRange before relying on this in production.
      - "traefik.http.routers.dispatcher.middlewares=admin-ipallowlist@file,security-headers@file"

  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infra/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - letsencrypt:/letsencrypt
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    networks: [edge]
    depends_on: [backend, frontend-patient, frontend-dispatcher]
