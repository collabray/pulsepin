# Traefik reverse-proxy layer (Security Architecture Section 3 & 6):
# - TLS 1.3 termination for all public traffic
# - Central point for the WAF middleware chain (infra/traefik/dynamic.yml)
# - Central point for IP allow-listing on admin interfaces
#
# This is real, runnable Traefik config — not a placeholder — but a
# production deployment should still put a dedicated WAF (Cloudflare,
# AWS WAF/ALB, or the ModSecurity Traefik plugin referenced in
# dynamic.yml) in front of this, per Security Architecture Section 3.
# Traefik alone provides rate limiting, header hardening, and TLS, not
# full WAF-grade signature detection.

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

providers:
  docker:
    exposedByDefault: false
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: ${ACME_EMAIL}
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web

api:
  dashboard: true
  insecure: false

log:
  level: INFO
