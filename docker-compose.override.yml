# Automatically merged by `docker compose up` (Compose reads
# docker-compose.yml + docker-compose.override.yml by default). Publishes
# ports directly for local development so you don't need to configure
# DNS/TLS just to run the stack on your laptop. Do NOT use this file's
# network exposure in production — deploy with `docker compose -f
# docker-compose.yml --profile prod up` instead, which keeps the internal
# network segmented behind Traefik only (see docker-compose.yml comments
# and Security Architecture Section 6).

services:
  backend:
    ports:
      - "8000:8000"
    environment:
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:5174"]'

  frontend-patient:
    ports:
      - "5173:80"

  frontend-dispatcher:
    ports:
      - "5174:80"

  traefik:
    # Not needed for local dev when ports are published directly above.
    profiles: ["prod"]

  db:
    ports:
      - "5432:5432"
